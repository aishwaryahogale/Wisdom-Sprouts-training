
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Footer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: white;
}

.footer {
    width: 100%;
    min-height: 90px;
    background: #101719;
    color: #aeb5b7;
    padding: 25px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

.footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 13px;
}

.footer-links a {
    text-decoration: none;
    color: #aeb5b7;
    font-size: 11px;
}

.footer-links a:hover {
    text-decoration: underline;
}

.footer-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-size: 11px;
}

.footer-bottom select {
    background: transparent;
    color: #aeb5b7;
    border: none;
    outline: none;
    font-size: 11px;
    cursor: pointer;
}

.footer-bottom select option {
    color: black;
}

@media(max-width: 600px) {
    .footer-links {
        gap: 10px;
    }

    .footer-links a {
        font-size: 10px;
    }

    .footer-bottom {
        flex-direction: column;
        gap: 10px;
    }
}
</style>
</head>

<body>

<footer class="footer">

    <div class="footer-links">
        <a href="#">Meta</a>
        <a href="#">About</a>
        <a href="#">Blog</a>
        <a href="#">Jobs</a>
        <a href="#">Help</a>
        <a href="#">API</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Locations</a>
        <a href="#">Instagram Lite</a>
        <a href="#">Threads</a>
        <a href="#">Contact Uploading & Non-Users</a>
        <a href="#">Meta Verified</a>
    </div>

    <div class="footer-bottom">

        <select>
            <option>English</option>
            <option>Hindi</option>
            <option>Marathi</option>
        </select>

        <span>© 2026 Instagram from Meta</span>

    </div>

</footer>

</body>
</html>
