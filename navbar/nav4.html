
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisdom Sprouts Navbar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: white;
    padding: 10px;
}

.navbar {
    min-height: 75px;
    background: #d5eae7;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 25px;
    gap: 20px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: #18766c;
    white-space: nowrap;
}

.logo small {
    display: block;
    font-size: 9px;
    font-weight: normal;
    text-align: center;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 17px;
}

.nav-links a {
    text-decoration: none;
    color: #333;
    font-size: 12px;
    white-space: nowrap;
}

.nav-links a:first-child {
    color: #f47b45;
}

.nav-links a:hover {
    color: #f47b45;
}

.contact-btn {
    background: #ff702c;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
}

.menu {
    display: none;
    font-size: 25px;
    cursor: pointer;
}

@media(max-width: 900px) {
    .nav-links {
        gap: 10px;
    }

    .nav-links a {
        font-size: 11px;
    }
}

@media(max-width: 700px) {
    .navbar {
        flex-wrap: wrap;
    }

    .menu {
        display: block;
    }

    .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
    }

    .nav-links.show {
        display: flex;
    }
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🌱 WISDOM SPROUTS
        <small>A Training Hub</small>
    </div>

    <div class="nav-links" id="navLinks">
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Courses</a>
        <a href="#">Blogs</a>
        <a href="#">Placements</a>
        <a href="#">Internship</a>
        <a href="#">Gallery</a>
        <a href="#">Hire From Us</a>
    </div>

    <button class="contact-btn">Contact Us</button>

    <div class="menu" onclick="toggleMenu()">☰</div>

</nav>


</body>
</html>
