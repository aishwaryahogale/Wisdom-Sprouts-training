
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMyShow Navbar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: white;
}

.top-navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 5%;
    gap: 20px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    color: #333;
    white-space: nowrap;
}

.logo span {
    color: #e53950;
}

.search {
    flex: 1;
    max-width: 480px;
    padding: 11px 15px;
    border: 1px solid #ddd;
    border-radius: 5px;
    outline: none;
}

.location {
    color: #444;
    font-size: 13px;
}

.signin {
    background: #f84464;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 9px 18px;
    cursor: pointer;
}

.menu {
    font-size: 23px;
    cursor: pointer;
}

.bottom-navbar {
    background: #f5f5f5;
    padding: 13px 5%;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
}

.links {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
}

.links a {
    text-decoration: none;
    color: #333;
    font-size: 13px;
}

.links a:hover {
    color: #f84464;
}

@media(max-width: 650px) {
    .top-navbar {
        flex-wrap: wrap;
    }

    .search {
        order: 3;
        flex-basis: 100%;
        max-width: 100%;
    }

    .bottom-navbar {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>

    <div class="top-navbar">

        <div class="logo">
            book<span>my</span>show
        </div>

        <input
            class="search"
            type="search"
            placeholder="Search for Movies, Events, Plays, Sports and Activities"
        >

        <div class="location">Pune ⌄</div>

        <button class="signin">Sign in</button>

        <div class="menu">☰</div>

    </div>

    <nav class="bottom-navbar">

        <div class="links">
            <a href="#">Movies</a>
            <a href="#">Stream</a>
            <a href="#">Events</a>
            <a href="#">Plays</a>
            <a href="#">Sports</a>
            <a href="#">Activities</a>
        </div>

        <div class="links">
            <a href="#">ListYourShow</a>
            <a href="#">Corporates</a>
            <a href="#">Offers</a>
            <a href="#">Gift Cards</a>
        </div>

    </nav>

</header>

</body>
</html>
