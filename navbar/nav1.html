
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Navbar</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #e9edef;
    padding: 30px;
}

.navbar {
    width: 100%;
    min-height: 65px;
    background: #111b21;
    color: white;
    display: flex;
    align-items: center;
    padding: 10px 20px;
    gap: 15px;
}

.profile {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #263c45;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.group-info {
    flex: 1;
    min-width: 0;
}

.group-info h3 {
    font-size: 14px;
    margin-bottom: 5px;
}

.group-info p {
    font-size: 11px;
    color: #aebac1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.actions {
    display: flex;
    align-items: center;
    gap: 18px;
}

.actions button {
    background: transparent;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.add-btn {
    border: 1px solid #536168 ;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px ;
}

@media(max-width: 600px) {
    body { padding: 10px; }
    .actions { gap: 10px; }
    .group-info p { max-width: 150px; }
}
</style>
</head>

<body>

<nav class="navbar">

    <div class="profile">👥</div>

    <div class="group-info">
        <h3>B101-W5-MERN-JFP</h3>
        <p>
            B101, B101Komal, B87, Swapneel, WS, WS,
            +91 755 869 3115, +91 87998 78829
        </p>
    </div>

    <div class="actions">
        <button class="add-btn">▣ Add to list⌄</button>
        <button title="Video call">▣⌄</button>
        <button title="Search">⌕</button>
        <button title="More">⋮</button>
    </div>

</nav>

</body>
</html>
