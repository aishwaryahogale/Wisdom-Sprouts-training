
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Image Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 200px);
            gap: 10px;
            max-width: 900px;
            margin: auto;
        }

        .box {
            position: relative;
            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .box h3 {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            font-weight: normal;
        }

        .box span {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            font-size: 10px;
        }

       

        .box1 {
            grid-column: 1;
            grid-row: 1;
        }

        .box2 {
            grid-column: 2 / 4;
            grid-row: 1;
        }

        .box3 {
            grid-column: 1 / 3;
            grid-row: 2;
        }

        .box4 {
            grid-column: 3;
            grid-row: 2;
        }

        .box5 {
            grid-column: 1;
            grid-row: 3;
        }

        .box6 {
            grid-column: 2;
            grid-row: 3;
        }

        .box7 {
            grid-column: 3;
            grid-row: 3;
        }

        .box8 {
            grid-column: 1 / 3;
            grid-row: 4;
        }

        .box9 {
            grid-column: 3;
            grid-row: 4;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box box1">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR99lA3rdVuztJE4jtkQhX6HdCnh8gxklk1hNoPj6WiQg&s=10.jpg" alt="Winter">
            <h3>The winter of my discontent</h3>
            <span>READ POST</span>
        </div>

        <div class="box box2">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT0CcGMjov-DFCzxHI4a7Gm_cK8K7iuan30VYl9_eZ-hg&s=10.jpg" alt="City">
            <h3>Instagram is toxic but I keep posting</h3>
            <span>READ POST</span>
        </div>

        <div class="box box3">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYF_PvQqQpPdThPZBpn67wWjpCnEqP6IbkfoMQDwCfzA&s=10.jpg" alt="Ocean">
            <h3>Throwing my phone into the ocean</h3>
            <span>READ POST</span>
        </div>

        <div class="box box4">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7VH6d2lL-h8B0JtOZY9k1QQajVxb6nquR4V-9ZiFGJQ&s=10.jpg" alt="Room">
            <h3>I'm never leaving my room</h3>
            <span>READ POST</span>
        </div>

    </div>

</body>
</html>
