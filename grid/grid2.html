
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
            padding: 25px;
        }

        .container {
            max-width: 480px;
            margin: auto;
            padding: 15px;
            border: 7px solid black;

            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 55px 55px 210px 55px;
            gap: 5px;
        }

        .box {
            border: 2px solid gray;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #548d42;
            font-size: 22px;
            text-align: center;
            padding: 5px;
        }

        .header {
            grid-column: 1 / 4;
        }

        .navigation {
            grid-column: 1 / 4;
        }

        .left-content {
            grid-column: 1;
        }

        .main-content {
            grid-column: 2;
        }

        .right-content {
            grid-column: 3;
        }

        .footer {
            grid-column: 1 / 4;
        }

      

        @media (max-width: 500px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 55px 55px 100px 180px 100px 55px;
            }

            .header,
            .navigation,
            .left-content,
            .main-content,
            .right-content,
            .footer {
                grid-column: 1;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box header">
            Header
        </div>

        <div class="box navigation">
            Navigation Menu
        </div>

        <div class="box left-content">
            Content
        </div>

        <div class="box main-content">
            Main<br>Content
        </div>

        <div class="box right-content">
            Content
        </div>

        <div class="box footer">
            Footer
        </div>

    </div>

</body>
</html>
