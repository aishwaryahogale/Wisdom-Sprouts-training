
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 400px;
            background-color: #f2f2f2;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 130px);
            gap: 10px;
            position: relative;
        }

        .container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 0 3px #ccc;
        }

        .img1 {
            grid-column: 1;
            grid-row: 1;
        }

        .img2 {
            grid-column: 2;
            grid-row: 1;
        }

        .img3 {
            grid-column: 3;
            grid-row: 1;
        }

        .img4 {
            grid-column: 1;
            grid-row: 2;
        }

        .img5 {
            grid-column: 2;
            grid-row: 2;
        }

        .img6 {
            grid-column: 3;
            grid-row: 2;
        }

        .img7 {
            grid-column: 1;
            grid-row: 3;
        }

        .img8 {
            grid-column: 2;
            grid-row: 3;
        }

        .img9 {
            grid-column: 3;
            grid-row: 3;
        }

        /* Center image larger */
        .img2 {
            position: relative;
            z-index: 2;
            transform: scale(1.25);
        }

    </style>
</head>

<body>

    <div class="container">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDUNS71RDdiVmlcE2Up16ngJF8_V3dn1Z2WSIdDlFx1g&s=10.jpg" class="img1" alt="Image 1">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKlzNVb0nhc_FiO_0F4eHcIP6oQDa8OaqVrfSJr6jqdg&s=10.jpg" class="img2" alt="Image 2">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxRcahaawfLM5Tr6XIjPgxS1xAD9RWa1YamTLgs5lXFw&s=10.jpg" class="img3" alt="Image 3">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThDIlXrjCd_kibucavSuboO60Bez6rPNWkdmpu_Goguw&s=10.jpg" class="img4" alt="Image 4">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWCNxfqBmr1MTWL87zoIQNgrDNim_JWzCWZHwmejOuhA&s=10.jpg" class="img5" alt="Image 5">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRma58oj4Eb3ylUEWvXqyqX5zptobiev7u93WVcLizwiA&s=10.jpg" class="img6" alt="Image 6">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUbKNueHRrdiHx8RzhPxa5QmyzGqL9rRZI5zUKhRzGtg&s=10.jpg" class="img7" alt="Image 7">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6S_GpZ5_MyiX79IJYbwL__1NPQjJ1Yz8VWkEIINpWUg&s=10.jpg" class="img8" alt="Image 8">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmZdVVqgdzdSYJsyA7M2p9YR57jqz16ViocfgCJQu9dg&s=10.jpg" class="img9" alt="Image 9">

    </div>

</body>
</html>
