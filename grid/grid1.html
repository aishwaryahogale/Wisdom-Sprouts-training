
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 60px 250px 150px 80px;
            gap: 10px;
            max-width: 1000px;
            margin: auto;
            padding: 10px;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid white;
        }

        .navbar {
            grid-column: 1 / 3;
            background: #80f5d7;
            justify-content: center;
        }

        .sidebar {
            grid-column: 1;
            grid-row: 2 / 4;
            background: #08dce7;
        }

        .main {
            grid-column: 2;
            grid-row: 2;
            background: #83f3f4;
        }

        .content {
            background: #64efc4;
        }

        .content-section {
            grid-column: 2;
            grid-row: 3;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .content1 {
            background: #65f1c6;
        }

        .content2 {
            background: #61edbd;
        }

        .content3 {
            background: #60edb5;
        }

        .footer {
            grid-column: 1 / 3;
            background: #10dba9;
            justify-content: center;
        }

        

        @media (max-width: 768px) {

            .container {
                grid-template-columns: 1fr;
                grid-template-rows: 50px 50px 200px 100px 100px 100px 60px;
            }

            .navbar {
                grid-column: 1;
                grid-row: 1;
            }

            .sidebar {
                grid-column: 1;
                grid-row: 2;
            }

            .main {
                grid-column: 1;
                grid-row: 3;
            }

            .content-section {
                grid-column: 1;
                grid-row: 4 / 7;
                display: grid;
                grid-template-columns: 1fr;
                grid-template-rows: repeat(3, 1fr);
            }

            .footer {
                grid-column: 1;
                grid-row: 7;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box navbar">
            NAVBAR
        </div>

        <div class="box sidebar">
            SIDEBAR
        </div>

        <div class="box main">
            MAIN
        </div>

        <div class="content-section">

            <div class="box content1">
                CONTENT 1
            </div>

            <div class="box content2">
                CONTENT 2
            </div>

            <div class="box content3">
                CONTENT 3
            </div>

        </div>

        <div class="box footer">
            FOOTER
        </div>

    </div>

</body>
</html>
