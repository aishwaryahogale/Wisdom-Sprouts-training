
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Circle Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: white;
        }

        .container {
            width: 380px;
            height: 320px;
            background-color: #d4b000;
            position: relative;
        }

        .circle {
            position: absolute;
            width: 140px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #d4b000;
        }

        .circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        
        .circle1 {
            top: 10px;
            left: 20px;
        }

        
        .circle2 {
            top: 10px;
            right: 10px;
        }

        
        .circle3 {
            width: 140px;
            height: 140px;
            top: 95px;
            left: 120px;
            z-index: 2;
        }

        
        .circle4 {
            bottom: 10px;
            left: 20px;
        }

        
        .circle5 {
            bottom: 10px;
            right: 10px;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="circle circle1">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkcsX4Gyzl1bvUoXGYcMOkXiwjw5VGrqMqfc_DEb_V1w&s=10.jpg" alt="Wolf">
        </div>

        <div class="circle circle2">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSEj4hQIJe7jZR0hZQpPoekDRJXWdvexKwkAIlYfnqbQ&s=10.jpg" alt="Tiger">
        </div>

        <div class="circle circle3">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRtxIYnedyJ1Yc5BqbOIxJ43l8ewPHrfXhzpLOJzTE56Q&s=10.jpg" alt="Lion">
        </div>

        <div class="circle circle4">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDn40_4WJ-CytUq3QIZl2ovHBVgjF0DaA4JEWniRk2oA&s=10.jpg" alt="Dog">
        </div>

        <div class="circle circle5">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScB25w4BV8r8m3JW_ywZc1VFruQCxA5GR8m6c4_0xCPA&s=10.jpg" alt="Bear">
        </div>

    </div>

</body>
</html>
